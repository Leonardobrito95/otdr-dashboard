<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertas · CANAÃ Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070C16;--bg2:#0D1625;--bg3:#111E30;--border:rgba(55,138,221,0.15);
    --accent:#378ADD;--ok:#2ECC71;--warn:#F5A623;--crit:#FF5B52;--dead:#7C8CA0;
    --text:#EAF1FA;--muted:#7D93AB;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(55,138,221,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(55,138,221,0.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--border);background:rgba(7,12,22,0.9);backdrop-filter:blur(12px)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.14em;color:var(--accent)}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-top:2px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  .nav-btn{padding:6px 14px;border-radius:5px;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.2s}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
  .nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(55,138,221,0.12)}

  main{position:relative;z-index:1;padding:24px 22px 40px;max-width:1200px;margin:0 auto}

  .filtros{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;animation:riseIn .4s ease both}
  .campo{display:flex;flex-direction:column;gap:5px}
  .campo label{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .campo input, .campo select{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s}
  .campo input:focus, .campo select:focus{border-color:var(--accent)}
  .campo input[type="text"]{min-width:160px}
  .btn-filtrar{padding:0 20px;height:38px;border-radius:8px;border:1px solid var(--accent);background:rgba(55,138,221,.1);color:var(--accent);font-family:var(--mono);font-size:12px;letter-spacing:.06em;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-filtrar:hover{background:rgba(55,138,221,.2)}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;animation:riseIn .4s ease both}
  .kpi-label{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .kpi-val{font-family:var(--mono);font-size:24px;font-weight:700}
  .kpi-val.ok{color:var(--ok)} .kpi-val.crit{color:var(--crit)} .kpi-val.accent{color:var(--accent)}

  .table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:auto;animation:riseIn .4s ease both}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:left;padding:12px 16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:11px 16px;border-bottom:1px solid rgba(55,138,221,.06);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(55,138,221,.04)}
  .mono{font-family:var(--mono)}
  .causa-cel{white-space:normal;max-width:340px;min-width:220px}
  .badge{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .badge.ativo{background:rgba(255,91,82,.14);color:var(--crit)}
  .badge.encerrado{background:rgba(46,204,113,.14);color:var(--ok)}

  .estado{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:12px}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="/static/logo.png" alt="CANAÃ" style="height:36px;width:auto;object-fit:contain">
    <div>
      <div class="logo-title">ALERTAS</div>
      <div class="logo-sub">HISTÓRICO DE QUEDAS DE PORTA</div>
    </div>
  </div>
  <nav>
    <a href="/painel" class="nav-btn">PAINEL</a>
    <a href="/" class="nav-btn">SINAL</a>
    <a href="/metricas" class="nav-btn">MÉTRICAS</a>
    <a href="/historico" class="nav-btn">HISTÓRICO</a>
    <a href="/alertas" class="nav-btn active">ALERTAS</a>
    <a href="/consulta" class="nav-btn">CONSULTA</a>
    <a href="/mapa" class="nav-btn">MAPA</a>
  </nav>
</header>

<main>
  <div class="filtros">
    <div class="campo">
      <label for="fIni">Início</label>
      <input type="date" id="fIni">
    </div>
    <div class="campo">
      <label for="fFim">Fim</label>
      <input type="date" id="fFim">
    </div>
    <div class="campo">
      <label for="fOlt">OLT</label>
      <input type="text" id="fOlt" placeholder="Ex: TAGUATINGA">
    </div>
    <div class="campo">
      <label for="fStatus">Status</label>
      <select id="fStatus">
        <option value="">Todos</option>
        <option value="ativo">Ativo</option>
        <option value="encerrado">Encerrado</option>
      </select>
    </div>
    <button class="btn-filtrar" onclick="carregar()">Filtrar</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div id="resultado">
    <div class="estado"><div class="spinner"></div>Carregando...</div>
  </div>
</main>

<script>
function fmtData(iso){
  if(!iso) return '--';
  const [d, h] = iso.split(' ');
  const [ano, mes, dia] = d.split('-');
  return `${dia}/${mes}/${ano} ${h ? h.slice(0,5) : ''}`;
}

function fmtDuracao(segundos){
  if(segundos == null) return '--';
  const min = Math.floor(segundos / 60);
  if(min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  if(h < 24) return `${h}h ${min % 60}min`;
  return `${Math.floor(h/24)}d ${h % 24}h`;
}

function renderKpis(lista){
  const ativos = lista.filter(a => a.ativo).length;
  const encerrados = lista.filter(a => !a.ativo);
  const duracaoMedia = encerrados.length
    ? encerrados.reduce((s,a) => s + (a.duracao_segundos||0), 0) / encerrados.length
    : null;
  const contagemCausa = {};
  lista.forEach(a => { contagemCausa[a.causa] = (contagemCausa[a.causa]||0) + 1; });
  const causaTop = Object.entries(contagemCausa).sort((a,b) => b[1]-a[1])[0];

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Total no período</div><div class="kpi-val accent">${lista.length}</div></div>
    <div class="kpi-card"><div class="kpi-label">Ativos agora</div><div class="kpi-val ${ativos ? 'crit' : 'ok'}">${ativos}</div></div>
    <div class="kpi-card"><div class="kpi-label">Duração média</div><div class="kpi-val">${duracaoMedia != null ? fmtDuracao(duracaoMedia) : '--'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Causa mais comum</div><div class="kpi-val" style="font-size:15px">${causaTop ? causaTop[0] : '--'}</div></div>
  `;
}

function renderTabela(lista){
  const res = document.getElementById('resultado');
  if(!lista.length){
    res.innerHTML = '<div class="empty">Nenhum alerta encontrado nesse filtro.</div>';
    return;
  }
  const linhas = lista.map(a => `
    <tr>
      <td class="mono">${fmtData(a.inicio)}</td>
      <td>${a.olt_nome}</td>
      <td class="mono">${a.porta}</td>
      <td class="causa-cel">${a.causa}</td>
      <td class="mono">${a.onus_afetados ?? '--'}${a.onus_total ? ' / ' + a.onus_total : ''}</td>
      <td class="mono">${a.fim ? fmtData(a.fim) : '--'}</td>
      <td class="mono">${fmtDuracao(a.duracao_segundos)}</td>
      <td><span class="badge ${a.ativo ? 'ativo' : 'encerrado'}">${a.ativo ? 'Ativo' : 'Encerrado'}</span></td>
    </tr>`).join('');

  res.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Início</th><th>OLT</th><th>Porta</th><th>Causa</th>
            <th>ONUs afetadas</th><th>Fim</th><th>Duração</th><th>Status</th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`;
}

async function carregar(){
  const res = document.getElementById('resultado');
  res.innerHTML = '<div class="estado"><div class="spinner"></div>Carregando...</div>';

  const params = new URLSearchParams();
  const ini = document.getElementById('fIni').value;
  const fim = document.getElementById('fFim').value;
  const olt = document.getElementById('fOlt').value.trim();
  const status = document.getElementById('fStatus').value;
  if(ini) params.set('inicio', ini);
  if(fim) params.set('fim', fim);
  if(olt) params.set('olt', olt);
  if(status) params.set('status', status);

  try{
    const data = await fetch('/api/historico/alertas?' + params.toString()).then(r => r.json());
    if(data.status !== 'ok') throw new Error(data.mensagem || 'erro');
    renderKpis(data.alertas || []);
    renderTabela(data.alertas || []);
  }catch(e){
    res.innerHTML = `<div class="empty" style="color:var(--crit)">Erro: ${e.message}</div>`;
  }
}

carregar();
</script>
</body>
</html>
