<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · CANAÃ Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070C16;--bg2:#0D1625;--bg3:#111E30;--border:rgba(55,138,221,0.15);
    --accent:#378ADD;--ok:#2ECC71;--warn:#F5A623;--crit:#FF5B52;--dead:#7C8CA0;
    --text:#EAF1FA;--muted:#7D93AB;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
    --ok-glow:rgba(46,204,113,.35);--warn-glow:rgba(245,166,35,.4);--crit-glow:rgba(255,91,82,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(55,138,221,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(55,138,221,0.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulseGlow{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--border);background:rgba(7,12,22,0.9);backdrop-filter:blur(12px)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.14em;color:var(--accent)}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-top:2px}
  nav{display:flex;gap:4px}
  .nav-btn{padding:6px 14px;border-radius:5px;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.2s}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
  .nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(55,138,221,0.12);box-shadow:0 0 16px rgba(55,138,221,.15)}
  .header-right{display:flex;align-items:center;gap:12px}
  .timestamp{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .btn-refresh{padding:5px 12px;border-radius:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all .2s}
  .btn-refresh:hover{border-color:var(--accent);color:var(--accent)}

  main{position:relative;z-index:1;padding:18px 22px 32px;max-width:1340px;margin:0 auto}

  /* ── Hero: status geral ─────────────────────────────── */
  .hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,rgba(13,22,37,.9),rgba(17,30,48,.6));border:1px solid var(--border);border-radius:12px;padding:20px 26px;margin-bottom:20px;position:relative;overflow:hidden;animation:riseIn .5s ease both}
  .hero.ok{box-shadow:inset 0 0 60px rgba(46,204,113,.06)}
  .hero.atencao{box-shadow:inset 0 0 60px rgba(245,166,35,.08)}
  .hero.critico{box-shadow:inset 0 0 60px rgba(255,91,82,.1)}
  .hero-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;animation:pulseGlow 2s infinite}
  .hero-dot.ok{background:var(--ok);box-shadow:0 0 24px var(--ok-glow)}
  .hero-dot.atencao{background:var(--warn);box-shadow:0 0 24px var(--warn-glow)}
  .hero-dot.critico{background:var(--crit);box-shadow:0 0 24px var(--crit-glow)}
  .hero-txt{flex:1}
  .hero-title{font-size:19px;font-weight:700;margin-bottom:3px}
  .hero-sub{font-size:12.5px;color:var(--muted)}
  .hero-chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.02);min-width:88px;cursor:pointer;transition:border-color .15s,transform .15s}
  .chip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .chip b{font-family:var(--mono);font-size:20px;line-height:1}
  .chip span{font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center}
  .chip.c-ok b{color:var(--ok)}
  .chip.c-warn b{color:var(--warn)}
  .chip.c-crit b{color:var(--crit)}

  .grid-2{display:grid;grid-template-columns:1fr;gap:20px}
  @media (min-width:960px){
    .grid-2{grid-template-columns:1fr 1fr;align-items:start}
    .grid-2 .section{margin-bottom:0}
  }

  .section{margin-bottom:20px;animation:riseIn .5s ease both;scroll-margin-top:16px}
  .section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .section-title{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
  .section-badge{font-family:var(--mono);font-size:10px;padding:2px 9px;border-radius:20px}
  .section-badge.ok{background:rgba(46,204,113,.14);color:var(--ok)}
  .section-badge.warn{background:rgba(245,166,35,.14);color:var(--warn)}
  .section-badge.crit{background:rgba(255,91,82,.14);color:var(--crit)}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .empty-ok{padding:26px 20px;text-align:center;color:var(--ok);font-size:13.5px}
  .empty-ok .chk{font-size:22px;display:block;margin-bottom:6px}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:10px 16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:10px 16px;font-size:12.5px;border-bottom:1px solid rgba(55,138,221,.06);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(55,138,221,.03)}
  .mono{font-family:var(--mono)}
  th.num,td.num{text-align:right}
  td.wrap{white-space:normal}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase}
  .tag.ok{background:rgba(46,204,113,.14);color:var(--ok)}
  .tag.atencao{background:rgba(245,166,35,.14);color:var(--warn)}
  .tag.critico{background:rgba(255,91,82,.14);color:var(--crit)}
  .muted{color:var(--muted)}
  .causa-crit{color:var(--crit)}
  .causa-warn{color:var(--warn)}
  .causa-muted{color:var(--muted)}
  .sla-resumo{padding:12px 16px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border)}
  .field-label{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .field-group{display:flex;flex-direction:column}

  /* ── Avisos de parada (SYNKR): prioridade máxima, cards e não tabela ── */
  @keyframes pulseBorderCrit{0%,100%{box-shadow:0 0 0 rgba(255,91,82,0)}50%{box-shadow:0 0 22px rgba(255,91,82,.3)}}
  @keyframes pulseBorderWarn{0%,100%{box-shadow:0 0 0 rgba(245,166,35,0)}50%{box-shadow:0 0 18px rgba(245,166,35,.22)}}
  .avisos-lista{display:flex;flex-direction:column;gap:12px}
  .aviso-card{background:linear-gradient(135deg,rgba(17,30,48,.9),rgba(13,22,37,.85));border:1px solid var(--border);border-radius:12px;padding:16px 20px;animation:riseIn .4s ease both}
  .aviso-card.critico{border-color:rgba(255,91,82,.45);animation:riseIn .4s ease both,pulseBorderCrit 2.4s infinite}
  .aviso-card.atencao{border-color:rgba(245,166,35,.4);animation:riseIn .4s ease both,pulseBorderWarn 2.8s infinite}
  .aviso-top{display:flex;align-items:flex-start;gap:14px}
  .aviso-icone{font-size:24px;flex-shrink:0;line-height:1.3}
  .aviso-info{flex:1;min-width:0}
  .aviso-desc{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.35}
  .aviso-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .aviso-prazo{text-align:right;flex-shrink:0;padding-left:10px}
  .aviso-prazo b{display:block;font-family:var(--mono);font-size:14px;white-space:nowrap}
  .aviso-prazo span{font-size:9.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .aviso-prazo.critico b{color:var(--crit)}
  .aviso-prazo.atencao b{color:var(--warn)}
  .aviso-prazo.ok b{color:var(--ok)}
  .aviso-actions{margin-top:14px;padding-top:14px;border-top:1px solid rgba(55,138,221,.1)}
  .btn-encerrar{border-color:rgba(255,91,82,.4);color:var(--crit)}
  .btn-encerrar:hover{background:rgba(255,91,82,.1);border-color:var(--crit)}
  .btn-ia{border-color:rgba(155,120,255,.4);color:#b9a3ff}
  .btn-ia:hover{background:rgba(155,120,255,.12);border-color:#b9a3ff}
  .aviso-causa-ia{margin-top:12px;padding:12px 14px;background:rgba(155,120,255,.08);border:1px solid rgba(155,120,255,.25);border-radius:8px;font-size:13px;line-height:1.5}
  .aviso-causa-ia .causa-disclaimer{display:block;margin-top:8px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}

  .tabs{display:flex;gap:2px;margin-bottom:0}
  .tab-btn{padding:9px 16px;border-radius:8px 8px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap}
  .tab-btn:hover{color:var(--accent)}
  .tab-btn.active{border-color:var(--border);color:var(--accent);background:var(--bg2);border-bottom-color:var(--bg2)}
  .tab-panels{background:var(--bg2);border:1px solid var(--border);border-radius:0 12px 12px 12px;overflow:hidden}
  .tab-panel{display:none;padding:16px}
  .tab-panel.active{display:block}
  .hist-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .hist-kpi{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
  .hist-kpi-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .hist-kpi-val{font-family:var(--mono);font-size:19px;font-weight:700}

  .row-clicavel{cursor:pointer}
  .expand-hint{display:inline-block;margin-left:8px;color:var(--muted);font-size:10px}
  .row-detalhe td{background:rgba(55,138,221,.03);padding:0}
  .detalhe-corpo{padding:12px 16px 16px}
  .detalhe-lista{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .detalhe-item{font-size:11.5px;color:var(--muted);display:flex;gap:10px}
  .detalhe-item b{color:var(--text);font-weight:600}
  .link-mais{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none}
  .link-mais:hover{text-decoration:underline}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:12px}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
</style>
<script src="/static/icons.js"></script>
</head>
<body>

<header>
  <div class="logo">
    <img src="/static/logo.png" alt="CANAÃ" style="height:36px;width:auto;object-fit:contain">
    <div>
      <div class="logo-title">PAINEL</div>
      <div class="logo-sub">VISÃO CONSOLIDADA DE PLANTÃO</div>
    </div>
  </div>
  <nav>
    <a href="/painel" class="nav-btn active">PAINEL</a>
    <a href="/" class="nav-btn">SINAL</a>
    <a href="/metricas" class="nav-btn">MÉTRICAS</a>
    <a href="/historico" class="nav-btn">HISTÓRICO</a>
    <a href="/consulta" class="nav-btn">CONSULTA</a>
    <a href="/mapa" class="nav-btn">MAPA</a>
  </nav>
  <div class="header-right">
    <span class="timestamp" id="timestamp">--</span>
    <button class="btn-refresh" onclick="carregar()"><i data-lucide="rotate-cw" data-size="12"></i> ATUALIZAR</button>
  </div>
</header>

<main>
  <div id="conteudo">
    <div class="loading"><div class="spinner"></div>Carregando painel...</div>
  </div>
</main>

<script>
const NIVEL_LBL = {ok:'OK', atencao:'Atenção', critico:'Crítico'};

function fmtDesde(iso) {
  if (!iso) return '--';
  const d = new Date(iso.replace(' ','T'));
  if (isNaN(d)) return '--';
  const min = Math.floor((Date.now()-d)/60000);
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h/24)} dia(s)`;
}

function fmtDesdeTs(ts) {
  if (!ts) return '--';
  return fmtDesde(new Date(ts*1000).toISOString().replace('T',' ').slice(0,19));
}

function irPara(id) {
  document.getElementById(id)?.scrollIntoView({behavior:'smooth', block:'start'});
}

function causaClasse(categoria) {
  if (categoria === 'los') return 'causa-crit';
  if (categoria === 'partial_los' || categoria === 'power') return 'causa-warn';
  return 'causa-muted';
}

async function carregar() {
  const el = document.getElementById('conteudo');
  // Dispara a busca do SYNKR em paralelo: é a informação de maior prioridade,
  // não deve esperar o resto do painel terminar de montar pra começar a buscar.
  const synkrPromise = fetch('/api/synkr/avisos').then(r => r.json()).catch(e => ({status:'erro', mensagem: e.message}));

  try {
    const r = await fetch('/api/painel');
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.mensagem || 'erro');
    document.getElementById('timestamp').textContent = d.timestamp;
    el.innerHTML = renderPainel(d);
  } catch(e) {
    el.innerHTML = `<div class="loading" style="color:var(--crit)">Erro ao carregar: ${e.message}</div>`;
    return;
  }
  aplicarSynkr(await synkrPromise);
}

async function carregarSynkr() {
  const d = await fetch('/api/synkr/avisos').then(r => r.json()).catch(e => ({status:'erro', mensagem: e.message}));
  aplicarSynkr(d);
}

function aplicarSynkr(d) {
  const container = document.getElementById('sec-synkr');
  if (!container) return;
  if (d.status !== 'ok') {
    container.innerHTML = `<div class="section-h"><div class="section-title">Avisos de parada ativos (SYNKR / Aprimorar)</div></div>
      <div class="panel"><div class="empty-ok" style="color:var(--crit)">Erro ao carregar avisos SYNKR: ${d.mensagem || 'erro'}</div></div>`;
    return;
  }
  container.innerHTML = renderSynkr(d);
  atualizarChipAvisos(d.avisos ? d.avisos.filter(a => !a.erro).length : 0);
}

function showTabSynkr(id, btn) {
  document.querySelectorAll('#synkr-tab-panels .tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('#synkr-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('synkrtab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'historico' && !_historicoAlertasCarregado) carregarHistoricoAlertasPainel();
}

let _historicoAlertasCarregado = false;
async function carregarHistoricoAlertasPainel() {
  _historicoAlertasCarregado = true;
  const el = document.getElementById('synkrtab-historico');
  el.innerHTML = '<div class="empty-ok" style="color:var(--muted)">Carregando histórico...</div>';
  try {
    const hoje = new Date();
    const ini = new Date(); ini.setDate(ini.getDate() - 30);
    const params = new URLSearchParams({ inicio: ini.toISOString().slice(0,10), fim: hoje.toISOString().slice(0,10) });
    const data = await fetch('/api/historico/alertas?' + params.toString()).then(r => r.json());
    if (data.status !== 'ok') throw new Error(data.mensagem || 'erro');
    el.innerHTML = renderHistoricoAlertasPainel(data.alertas || []);
  } catch(e) {
    el.innerHTML = `<div class="empty-ok" style="color:var(--crit)">Erro ao carregar histórico: ${e.message}</div>`;
  }
}

function fmtDataHist(iso) {
  if (!iso) return '--';
  const [d, h] = iso.split(' ');
  const [ano, mes, dia] = d.split('-');
  return `${dia}/${mes} ${h ? h.slice(0,5) : ''}`;
}
function fmtDuracaoHist(seg) {
  if (seg == null) return '--';
  const min = Math.floor(seg/60);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min/60);
  if (h < 24) return `${h}h ${min%60}min`;
  return `${Math.floor(h/24)}d ${h%24}h`;
}

function renderHistoricoAlertasPainel(lista) {
  if (!lista.length) {
    return `<div class="empty-ok"><span class="chk">${lucide('check',20)}</span>Nenhum alerta nos últimos 30 dias</div>`;
  }
  const ativos = lista.filter(a => a.ativo).length;
  const encerrados = lista.filter(a => !a.ativo);
  const duracaoMedia = encerrados.length
    ? encerrados.reduce((s,a) => s + (a.duracao_segundos||0), 0) / encerrados.length
    : null;

  const kpis = `<div class="hist-kpi-row">
    <div class="hist-kpi"><div class="hist-kpi-label">Últimos 30 dias</div><div class="hist-kpi-val">${lista.length}</div></div>
    <div class="hist-kpi"><div class="hist-kpi-label">Ativos agora</div><div class="hist-kpi-val" style="color:${ativos ? 'var(--crit)' : 'var(--ok)'}">${ativos}</div></div>
    <div class="hist-kpi"><div class="hist-kpi-label">Duração média</div><div class="hist-kpi-val">${duracaoMedia != null ? fmtDuracaoHist(duracaoMedia) : '--'}</div></div>
    <div class="hist-kpi"><div class="hist-kpi-label">Ver tudo</div><div class="hist-kpi-val" style="font-size:12px"><a href="/historico" style="color:var(--accent);text-decoration:none">Histórico de sinal ${lucide('arrow-right',11)}</a></div></div>
  </div>`;

  const rows = lista.slice(0, 30).map(a => `
    <tr>
      <td class="mono">${fmtDataHist(a.inicio)}</td>
      <td>${a.olt_nome}</td>
      <td class="mono">${a.porta}</td>
      <td class="wrap">${a.causa}</td>
      <td class="mono num">${a.onus_afetados ?? '--'}</td>
      <td class="mono">${a.fim ? fmtDataHist(a.fim) : '--'}</td>
      <td class="mono">${fmtDuracaoHist(a.duracao_segundos)}</td>
      <td><span class="tag ${a.ativo ? 'critico' : 'ok'}">${a.ativo ? 'Ativo' : 'Encerrado'}</span></td>
    </tr>`).join('');
  const extra = lista.length > 30 ? `<div style="padding:8px 16px;font-size:11px;color:var(--muted)">+ ${lista.length-30} outro(s) nos últimos 30 dias</div>` : '';

  return kpis + `<div class="table-wrap"><table>
    <thead><tr><th>Início</th><th>OLT</th><th>Porta</th><th>Causa</th><th class="num">ONUs</th><th>Fim</th><th>Duração</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>${extra}`;
}

function atualizarChipAvisos(qtd) {
  const chipsEl = document.querySelector('.hero-chips');
  if (!chipsEl) return;
  document.getElementById('chip-avisos')?.remove();
  if (qtd <= 0) return;
  const chip = document.createElement('div');
  chip.id = 'chip-avisos';
  chip.className = 'chip c-crit';
  chip.onclick = () => irPara('sec-synkr');
  chip.innerHTML = `<b>${qtd}</b><span>Avisos SYNKR</span>`;
  chipsEl.prepend(chip);
}

const STATUS_SYNKR = {1:'Ativo', 2:'Prazo expirado', 3:'Encerrado'};

function prazoUrgencia(deadlineStr) {
  if (!deadlineStr) return {texto:'--', classe:'ok'};
  const d = new Date(deadlineStr);
  if (isNaN(d)) return {texto:'--', classe:'ok'};
  const diffMin = Math.round((d - Date.now())/60000);
  const abs = Math.abs(diffMin);
  const h = Math.floor(abs/60), m = abs%60;
  const txt = h > 0 ? `${h}h${m>0?m+'min':''}` : `${m} min`;
  if (diffMin < 0)   return {texto:`venceu há ${txt}`, classe:'critico'};
  if (diffMin < 60)  return {texto:`${txt} restantes`, classe:'critico'};
  if (diffMin < 180) return {texto:`${txt} restantes`, classe:'atencao'};
  return {texto:`${txt} restantes`, classe:'ok'};
}

function renderSynkr(d) {
  const validos = (d.avisos || []).filter(a => !a.erro);
  const badge = validos.length ? `<span class="section-badge crit">${validos.length} ativo(s)</span>` : `<span class="section-badge ok">OK</span>`;

  let conteudoAtivos;
  if (!d.configurado) {
    conteudoAtivos = `<div class="panel"><div class="empty-ok" style="color:var(--muted)">SYNKR não configurado.</div></div>`;
  } else if (!d.avisos.length) {
    conteudoAtivos = `<div class="panel"><div class="empty-ok"><span class="chk">${lucide('check',20)}</span>Nenhum aviso de parada aberto</div></div>`;
  } else {
    conteudoAtivos = `<div class="avisos-lista">${renderAvisosCards(d.avisos)}</div>`;
  }

  return `<div class="section-h"><div class="section-title">Avisos de parada ativos (SYNKR / Aprimorar)</div>${badge}</div>
    <div class="tabs" id="synkr-tabs">
      <button class="tab-btn active" onclick="showTabSynkr('ativos', this)">${lucide('triangle-alert',12)} ALERTAS ATIVOS</button>
      <button class="tab-btn" onclick="showTabSynkr('historico', this)">${lucide('history',12)} HISTÓRICO DE ALERTAS</button>
    </div>
    <div class="tab-panels" id="synkr-tab-panels">
      <div id="synkrtab-ativos" class="tab-panel active">${conteudoAtivos}</div>
      <div id="synkrtab-historico" class="tab-panel"><div class="empty-ok" style="color:var(--muted)">Clique na aba para carregar o histórico dos últimos 30 dias.</div></div>
    </div>`;
}

function renderAvisosCards(avisos) {
  return avisos.map(a => {
    if (a.erro) return `<div class="aviso-card"><div class="muted" style="white-space:normal">${a.chave}: erro ao consultar (${a.erro})</div></div>`;
    const prazo = prazoUrgencia(a.deadline);
    return `
    <div class="aviso-card ${prazo.classe}">
      <div class="aviso-top">
        <span class="aviso-icone">${lucide('triangle-alert',24)}</span>
        <div class="aviso-info">
          <div class="aviso-desc">${a.description || '--'}</div>
          <div class="aviso-meta">
            <span class="mono">#${a.notice_id}</span>
            <span class="tag ${a.status===1?'atencao':'ok'}">${STATUS_SYNKR[a.status] || a.status}</span>
            <span>prazo: ${a.deadline ? a.deadline.replace('T',' ').slice(0,16) : '--'}</span>
          </div>
        </div>
        <div class="aviso-prazo ${prazo.classe}">
          <b>${prazo.texto}</b>
          <span>Prazo</span>
        </div>
      </div>
      <div class="aviso-actions">
        <button class="btn-refresh" onclick="toggleForm('${a.chave}')">Atualizar prazo</button>
        <div id="form-${a.chave}" style="display:none;margin-top:12px">
          <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
            <div class="field-group">
              <label class="field-label" for="deadline-${a.chave}">Novo prazo</label>
              <input type="datetime-local" id="deadline-${a.chave}" class="busca-input" style="max-width:220px;padding:8px 10px">
            </div>
            <div class="field-group" style="flex:1;min-width:200px">
              <label class="field-label" for="desc-${a.chave}">Descrição / motivo (opcional)</label>
              <input type="text" id="desc-${a.chave}" placeholder="Ex: técnico avaliou local, previsão revisada" class="busca-input" style="padding:8px 10px">
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:10px">
            <button class="btn-refresh" onclick="atualizarPrazo('${a.chave}')">Salvar novo prazo</button>
            <button class="btn-refresh btn-encerrar" onclick="encerrarAviso('${a.chave}')">Encerrar agora</button>
          </div>
          <div id="msg-${a.chave}" style="font-size:11.5px;margin-top:8px"></div>
        </div>
        <button class="btn-refresh btn-ia" style="margin-top:10px" id="btn-causa-${a.chave}" onclick="analisarCausa('${a.chave}')">${lucide('bot',14)} Analisar causa provável</button>
        <div id="causa-${a.chave}" class="aviso-causa-ia" style="display:none"></div>
      </div>
    </div>`;
  }).join('');
}

function toggleForm(chave) {
  const el = document.getElementById(`form-${chave}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function atualizarPrazo(chave) {
  const deadlineEl = document.getElementById(`deadline-${chave}`);
  const descEl = document.getElementById(`desc-${chave}`);
  const msgEl = document.getElementById(`msg-${chave}`);
  if (!deadlineEl.value) {
    msgEl.style.color = 'var(--crit)';
    msgEl.textContent = 'Informe o novo prazo.';
    return;
  }
  msgEl.style.color = 'var(--muted)';
  msgEl.textContent = 'Salvando...';
  try {
    const r = await fetch('/api/synkr/atualizar', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chave, deadline: deadlineEl.value, description: descEl.value}),
    });
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.mensagem || 'erro');
    msgEl.style.color = 'var(--ok)';
    msgEl.textContent = 'Prazo atualizado.';
    setTimeout(carregarSynkr, 1200);
  } catch(e) {
    msgEl.style.color = 'var(--crit)';
    msgEl.textContent = `Erro: ${e.message}`;
  }
}

async function encerrarAviso(chave) {
  if (!confirm('Confirma o encerramento manual deste aviso? Use só se tiver certeza de que o problema já foi resolvido, essa ação não pode ser desfeita por aqui.')) return;
  const descEl = document.getElementById(`desc-${chave}`);
  const msgEl = document.getElementById(`msg-${chave}`);
  msgEl.style.color = 'var(--muted)';
  msgEl.textContent = 'Encerrando...';
  try {
    const r = await fetch('/api/synkr/encerrar', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chave, motivo: descEl.value}),
    });
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.mensagem || 'erro');
    msgEl.style.color = 'var(--ok)';
    msgEl.textContent = 'Aviso encerrado.';
    setTimeout(carregarSynkr, 1200);
  } catch(e) {
    msgEl.style.color = 'var(--crit)';
    msgEl.textContent = `Erro: ${e.message}`;
  }
}

async function analisarCausa(chave) {
  const btn = document.getElementById(`btn-causa-${chave}`);
  const box = document.getElementById(`causa-${chave}`);
  box.style.display = 'block';
  box.style.color = 'var(--muted)';
  box.textContent = 'Analisando dados da porta...';
  btn.disabled = true;
  try {
    const r = await fetch('/api/synkr/causa_provavel', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chave}),
    });
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.mensagem || 'erro');
    box.style.color = '';
    box.innerHTML = `${d.causa}<span class="causa-disclaimer">Sugestão gerada por IA a partir dos dados da rede. Revise antes de repassar ao cliente ou à Aprimorar.</span>`;
  } catch(e) {
    box.style.color = 'var(--crit)';
    box.textContent = `Erro: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

function renderPainel(d) {
  const heroTxt = {
    ok:      'Tudo operando normalmente',
    atencao: 'Pontos de atenção identificados',
    critico: 'Situação crítica exige ação',
  }[d.nivel_geral];

  const hero = `
    <div class="hero ${d.nivel_geral}">
      <div class="hero-dot ${d.nivel_geral}"></div>
      <div class="hero-txt">
        <div class="hero-title">${heroTxt}</div>
        <div class="hero-sub">Atualizado ${d.timestamp}</div>
      </div>
      <div class="hero-chips">
        <div class="chip ${d.resumo.outages_ativos>0?'c-crit':'c-ok'}" onclick="irPara('sec-outages')"><b>${d.resumo.outages_ativos}</b><span>Outages ativas</span></div>
        <div class="chip ${d.resumo.olts_critico>0?'c-crit':d.resumo.olts_atencao>0?'c-warn':'c-ok'}" onclick="irPara('sec-olts')"><b>${d.resumo.olts_critico + d.resumo.olts_atencao}</b><span>OLTs em alerta</span></div>
        <div class="chip ${d.resumo.chamados_critico>0?'c-crit':d.resumo.chamados_atencao>0?'c-warn':'c-ok'}" onclick="irPara('sec-chamados')"><b>${d.resumo.chamados_critico}</b><span>Chamados represados</span></div>
      </div>
    </div>`;

  return hero +
         `<div class="section" id="sec-synkr">
            <div class="section-h"><div class="section-title">Avisos de parada ativos (SYNKR / Aprimorar)</div></div>
            <div class="panel"><div class="empty-ok" style="color:var(--muted)">Carregando avisos...</div></div>
          </div>` +
         `<div class="grid-2">${secaoOutages(d)}${secaoOlts(d)}</div>` +
         secaoChamados(d);
}

function secaoOutages(d) {
  const badge = d.outages.length ? `<span class="section-badge crit">${d.outages.length} ativa(s)</span>` : `<span class="section-badge ok">OK</span>`;
  let corpo;
  if (!d.outages.length) {
    corpo = `<div class="empty-ok"><span class="chk">${lucide('check',20)}</span>Nenhuma outage de PON ativa agora</div>`;
  } else {
    const rows = d.outages.map(o => `
      <tr>
        <td><b>${o.olt_nome}</b></td>
        <td class="mono">${o.board}/${o.port}</td>
        <td class="${causaClasse(o.categoria)}">${o.causa}</td>
        <td class="mono num">${o.afetados ?? '--'}${o.afetados_pct!=null ? ` (${o.afetados_pct}%)` : ''}</td>
        <td class="muted">${fmtDesde(o.desde)}</td>
      </tr>`).join('');
    corpo = `<div class="table-wrap"><table>
      <thead><tr><th>OLT</th><th>Porta</th><th>Causa</th><th class="num">Afetados</th><th>Desde</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  return `<div class="section" id="sec-outages">
    <div class="section-h"><div class="section-title">Outages de PON ativas agora</div>${badge}</div>
    <div class="panel">${corpo}</div>
  </div>`;
}

function cssId(nome) {
  return String(nome).replace(/[^a-zA-Z0-9]/g, '_');
}

function secaoOlts(d) {
  const badge = d.olts_alerta.length ? `<span class="section-badge crit">${d.olts_alerta.length}</span>` : `<span class="section-badge ok">OK</span>`;
  let corpo;
  if (!d.olts_alerta.length) {
    corpo = `<div class="empty-ok"><span class="chk">${lucide('check',20)}</span>Todas as OLTs estão saudáveis</div>`;
  } else {
    const rows = d.olts_alerta.map(o => { const id = cssId(o.olt); return `
      <tr class="row-clicavel" onclick="toggleOltDetalhe('${o.olt}')">
        <td><b>${o.olt}</b><span class="expand-hint" id="hint-${id}">${lucide('chevron-right',12)}</span></td>
        <td><span class="tag ${o.nivel}">${NIVEL_LBL[o.nivel]}</span></td>
        <td class="mono num">${o.pct_offline}%</td>
        <td class="mono num">${o.offline}/${o.total}</td>
        <td class="muted">${o.critico_desde ? fmtDesdeTs(o.critico_desde) : '--'}</td>
      </tr>
      <tr class="row-detalhe" id="detalhe-${id}" style="display:none">
        <td colspan="5"><div class="detalhe-corpo" id="detalhe-corpo-${id}">Carregando...</div></td>
      </tr>`; }).join('');
    corpo = `<div class="table-wrap"><table>
      <thead><tr><th>OLT</th><th>Nível</th><th class="num">% Offline</th><th class="num">Offline/Total</th><th>Crítico desde</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  return `<div class="section" id="sec-olts">
    <div class="section-h"><div class="section-title">OLTs em atenção ou crítico</div>${badge}</div>
    <div class="panel">${corpo}</div>
  </div>`;
}

const _oltDetalheCache = {};
async function toggleOltDetalhe(olt) {
  const id = cssId(olt);
  const linha = document.getElementById(`detalhe-${id}`);
  const jaAberta = linha.style.display !== 'none';

  document.querySelectorAll('.row-detalhe').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.expand-hint').forEach(el => el.innerHTML = lucide('chevron-right',12));
  if (jaAberta) return;

  linha.style.display = 'table-row';
  document.getElementById(`hint-${id}`).innerHTML = lucide('chevron-down',12);
  const corpo = document.getElementById(`detalhe-corpo-${id}`);

  if (_oltDetalheCache[olt]) { corpo.innerHTML = _oltDetalheCache[olt]; return; }

  corpo.textContent = 'Carregando...';
  try {
    const data = await fetch('/api/saude_olt/offline?olt=' + encodeURIComponent(olt)).then(r => r.json());
    const lista = (data.onus || []).slice(0, 20);
    if (!lista.length) {
      corpo.innerHTML = '<span class="muted">Nenhum cliente offline identificado nessa OLT.</span>';
    } else {
      const itens = lista.map(o => `
        <div class="detalhe-item">
          <span class="mono">${o.porta}</span>
          <b>${o.cliente_nome || '(sem vínculo)'}</b>
          <span>${o.status}</span>
        </div>`).join('');
      const restante = data.total > 20 ? `<div class="muted" style="margin-top:6px;font-size:11px">+ ${data.total - 20} outro(s)</div>` : '';
      corpo.innerHTML = `<div class="detalhe-lista">${itens}</div>${restante}`;
    }
    _oltDetalheCache[olt] = corpo.innerHTML;
  } catch(e) {
    corpo.innerHTML = `<span style="color:var(--crit)">Erro ao carregar: ${e.message}</span>`;
  }
}

function secaoChamados(d) {
  const sla = d.sla;
  const badge = sla.represados_critico > 0 ? `<span class="section-badge crit">${sla.represados_critico} represado(s)</span>` : `<span class="section-badge ok">OK</span>`;
  let corpo;
  if (!sla.mais_antigos.length) {
    corpo = `<div class="empty-ok"><span class="chk">${lucide('check',20)}</span>Nenhum chamado técnico em aberto</div>`;
  } else {
    const resumo = `<div class="sla-resumo">${sla.total_abertos} chamado(s) em aberto · média de <b style="color:var(--text)">${sla.media_dias}</b> dia(s) · ${sla.represados_critico} com ${sla.limiares.critico}+ dias</div>`;
    const rows = sla.mais_antigos.map(o => {
      const cls = o.dias_aberto >= sla.limiares.critico ? 'critico' : o.dias_aberto >= sla.limiares.atencao ? 'atencao' : 'ok';
      return `<tr>
        <td class="mono">#${o.id_atd}</td>
        <td class="wrap">${o.nome||'--'}</td>
        <td class="wrap">${o.assunto||'--'}</td>
        <td>${o.pop||'--'}</td>
        <td class="num"><span class="tag ${cls}">${o.dias_aberto} dia(s)</span></td>
      </tr>`;
    }).join('');
    corpo = resumo + `<div class="table-wrap"><table>
      <thead><tr><th>#OS</th><th>Cliente</th><th>Assunto</th><th>POP</th><th class="num">Tempo aberto</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="padding:0 16px 14px"><a class="link-mais" href="/os" target="_blank">Ver detalhes técnicos completos (filtros, sinal, endereço) ${lucide('arrow-right',11)}</a></div>`;
  }
  return `<div class="section" id="sec-chamados">
    <div class="section-h"><div class="section-title">Chamados técnicos represados</div>${badge}</div>
    <div class="panel">${corpo}</div>
  </div>`;
}

carregar();
</script>
</body>
</html>
