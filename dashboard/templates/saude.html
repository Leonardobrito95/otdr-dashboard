<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde da Rede — CANAÃ Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070C16;--bg2:#0D1625;--bg3:#111E30;--border:rgba(55,138,221,0.15);
    --accent:#378ADD;--ok:#2ECC71;--warn:#F5A623;--crit:#FF5B52;--dead:#7C8CA0;
    --text:#EAF1FA;--muted:#7D93AB;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
    --ok-glow:rgba(46,204,113,.35);--warn-glow:rgba(245,166,35,.4);--crit-glow:rgba(255,91,82,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
  /* atmosfera: grid + glow radial no topo */
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(55,138,221,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(55,138,221,0.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse at center,rgba(55,138,221,0.10),transparent 70%);pointer-events:none;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulseGlow{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--border);background:rgba(7,12,22,0.9);backdrop-filter:blur(12px)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.14em;color:var(--accent)}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-top:2px}
  nav{display:flex;gap:4px}
  .nav-btn{padding:6px 14px;border-radius:5px;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.2s}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
  .nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(55,138,221,0.12);box-shadow:0 0 16px rgba(55,138,221,.15)}
  .timestamp{font-family:var(--mono);font-size:11px;color:var(--muted)}
  main{position:relative;z-index:1;padding:18px 22px 32px;max-width:1340px;margin:0 auto}

  /* ── Banner: pulso da rede ─────────────────────────────── */
  .hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,rgba(13,22,37,.9),rgba(17,30,48,.6));border:1px solid var(--border);border-radius:12px;padding:15px 20px;margin-bottom:18px;position:relative;overflow:hidden;animation:riseIn .5s ease both}
  .hero-gauge{position:relative;flex-shrink:0;width:92px;height:92px;display:flex;align-items:center;justify-content:center}
  .hero-gauge .val{position:absolute;text-align:center}
  .hero-gauge .val b{font-family:var(--mono);font-size:21px;font-weight:700;color:var(--text);display:block;line-height:1}
  .hero-gauge .val span{font-size:7.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .hero-txt{flex:1;min-width:200px}
  .hero-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .hero-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulseGlow 2s infinite}
  .hero-txt h1{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin-bottom:4px}
  .hero-txt p{font-size:12px;color:var(--muted);max-width:520px;line-height:1.45}
  .hero-chips{display:flex;gap:9px;flex-shrink:0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(7,12,22,.4);min-width:70px;transition:transform .2s}
  .chip:hover{transform:translateY(-2px)}
  .chip b{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
  .chip span{font-size:8.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .chip.critico{border-color:rgba(255,91,82,.35)}.chip.critico b{color:var(--crit)}
  .chip.atencao{border-color:rgba(245,166,35,.3)}.chip.atencao b{color:var(--warn)}
  .chip.ok{border-color:rgba(46,204,113,.3)}.chip.ok b{color:var(--ok)}

  /* ── Seções ─────────────────────────────────────────────── */
  .sec-label{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .sec-label .tag{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700}
  .sec-label .tag.alerta{background:rgba(255,91,82,.14);color:var(--crit)}
  .sec-label .tag.saudavel{background:rgba(46,204,113,.14);color:var(--ok)}
  .sec + .sec{margin-top:22px}

  /* ── Cards de destaque (crítico / atenção) ──────────────── */
  .grid-alerta{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
  .acard{background:linear-gradient(160deg,var(--bg2),rgba(13,22,37,.5));border:1px solid var(--border);border-radius:12px;padding:15px 17px;position:relative;overflow:hidden;animation:riseIn .5s ease both}
  .acard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
  .acard.critico::before{background:linear-gradient(90deg,var(--crit),transparent);box-shadow:0 0 18px var(--crit-glow)}
  .acard.atencao::before{background:linear-gradient(90deg,var(--warn),transparent);box-shadow:0 0 16px var(--warn-glow)}
  .acard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .acard-olt{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .acard-zone{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
  /* selo de alerta: fundo neutro escuro + borda/ícone/texto vermelho (alto contraste) */
  .acard-alerta{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:4px 10px;border-radius:6px;background:rgba(6,10,18,.6);border:1px solid rgba(255,91,82,.5);font-family:var(--mono);font-size:9.5px;color:#FF8A83;letter-spacing:.02em}
  .acard-alerta .ping{width:5px;height:5px;border-radius:50%;background:var(--crit);box-shadow:0 0 8px var(--crit);animation:pulseGlow 1.5s infinite}
  .badge{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.09em;padding:4px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase}
  .badge.critico{background:rgba(255,91,82,.16);color:var(--crit);box-shadow:0 0 14px var(--crit-glow)}
  .badge.atencao{background:rgba(245,166,35,.16);color:var(--warn)}
  .acard-body{display:flex;align-items:center;gap:16px}
  .gauge-wrap{position:relative;flex-shrink:0;width:78px;height:78px;display:flex;align-items:center;justify-content:center}
  .gauge-wrap .g-val{position:absolute;text-align:center}
  .gauge-wrap .g-val b{font-family:var(--mono);font-size:17px;font-weight:700;display:block;line-height:1}
  .gauge-wrap .g-val.critico b{color:var(--crit)}.gauge-wrap .g-val.atencao b{color:var(--warn)}.gauge-wrap .g-val.ok b{color:var(--ok)}
  .gauge-wrap .g-val span{font-size:7px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .acard-info{flex:1;min-width:0}
  /* hierarquia: nº absoluto de afetados é o indicador primário */
  .acard-clientes{margin-bottom:11px}
  .acard-clientes .big{display:block;font-family:var(--mono);font-size:26px;font-weight:700;color:var(--text);line-height:1}
  .acard-clientes .mut{display:block;color:var(--muted);font-size:11px;margin-top:3px}
  /* breakdown em grid alinhado: [ícone] [valor] [descrição] */
  .breakdown{display:flex;flex-direction:column;gap:5px}
  .bk{display:grid;grid-template-columns:19px 32px 1fr;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .bk .bk-ic{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px}
  .bk.energia .bk-ic{background:rgba(155,89,182,.15);color:#B98BD8}
  .bk.offline .bk-ic{background:rgba(255,91,82,.14);color:var(--crit)}
  .bk.sinal .bk-ic{background:rgba(230,126,34,.15);color:#E9954A}
  .bk b{font-family:var(--mono);color:var(--text);font-weight:700;text-align:right}
  .acard-lixo{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(124,140,160,.2);font-family:var(--mono);font-size:10px;color:var(--dead);opacity:.8}
  .acard-btn{width:100%;margin-top:14px;padding:9px;border-radius:8px;border:1px solid var(--accent);background:rgba(55,138,221,.06);color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.07em;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px}
  .acard-btn:hover{background:rgba(55,138,221,.16);box-shadow:0 0 20px rgba(55,138,221,.2)}

  /* ── Cards compactos (saudáveis): barra linear ──────────── */
  .grid-ok{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
  .okcard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;transition:all 0.2s;animation:riseIn .5s ease both}
  .okcard:hover{border-color:rgba(46,204,113,.35);transform:translateY(-2px)}
  .okcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .okcard-olt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .okcard-pct{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ok);flex-shrink:0}
  .okcard-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:7px}
  .okcard-bar-fill{height:100%;border-radius:2px;background:var(--ok)}
  .okcard-sub{font-size:10.5px;color:var(--muted)}
  .okcard-sub b{font-family:var(--mono);color:#A8BACD}

  /* ── Toolbar: visualização + ordenação ──────────────────── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .view-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .vt-btn{padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
  .vt-btn+.vt-btn{border-left:1px solid var(--border)}
  .vt-btn.active{background:rgba(55,138,221,.14);color:var(--accent)}
  .tb-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sort-box{display:flex;align-items:center;gap:8px}
  .sort-box label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .btn-limpeza{padding:7px 14px;border-radius:8px;border:1px solid rgba(124,140,160,.4);background:transparent;color:#A8BACD;font-family:var(--mono);font-size:10px;letter-spacing:.05em;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-limpeza:hover{border-color:var(--dead);background:rgba(124,140,160,.1)}
  .btn-limpeza:disabled{opacity:.5;cursor:wait}
  /* abas do modal */
  .modal-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 24px 0}
  .mt-btn{flex:1;padding:9px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .2s}
  .mt-btn+.mt-btn{border-left:1px solid var(--border)}
  .mt-btn.active{background:rgba(55,138,221,.14);color:var(--accent)}
  .porta-bar{width:100%;max-width:180px;height:16px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden;display:flex}
  .porta-seg-ativo{height:100%;background:var(--ok)}
  .porta-seg-lixo{height:100%;background:var(--dead);opacity:.6}
  .porta-livre{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .porta-cheia{color:var(--warn);font-weight:700}
  .sort-sel{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 11px;outline:none;cursor:pointer}
  .sort-sel:focus{border-color:var(--accent)}

  /* ── Modo Lista (tabela compacta) ───────────────────────── */
  .list-view{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:riseIn .5s ease both}
  .lv-table{width:100%;border-collapse:collapse}
  .lv-table thead th{background:var(--bg3);padding:11px 16px;text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .lv-table td{padding:11px 16px;border-top:1px solid rgba(55,138,221,.06);font-size:12.5px;white-space:nowrap}
  .lv-row{cursor:pointer;transition:background .15s}
  .lv-row:hover td{background:rgba(55,138,221,.05)}
  .lv-status{display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .lv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .lv-dot.critico{background:var(--crit);box-shadow:0 0 8px var(--crit-glow)}
  .lv-dot.atencao{background:var(--warn)}
  .lv-dot.ok{background:var(--ok)}
  .lv-pct{font-family:var(--mono);font-weight:700}
  .lv-pct.critico{color:var(--crit)}.lv-pct.atencao{color:var(--warn)}.lv-pct.ok{color:var(--ok)}
  .lv-bar{width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;display:inline-block;vertical-align:middle}
  .lv-bar-fill{height:100%;border-radius:3px}
  .lv-bar-fill.critico{background:var(--crit)}.lv-bar-fill.atencao{background:var(--warn)}.lv-bar-fill.ok{background:var(--ok)}
  .lv-mono{font-family:var(--mono);color:var(--muted);font-size:11.5px}
  .lv-abs{font-family:var(--mono);font-weight:700;color:var(--text)}
  .lv-mini{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .hidden{display:none!important}

  .loading{text-align:center;padding:80px;color:var(--muted);font-family:var(--mono);font-size:12px}
  .spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}

  /* ── Modal ──────────────────────────────────────────────── */
  .modal-ov{position:fixed;inset:0;background:rgba(4,8,16,0.84);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;padding:24px}
  .modal-ov.open{opacity:1;pointer-events:all}
  .modal{background:var(--bg2);border:1px solid rgba(55,138,221,0.3);border-radius:16px;width:min(940px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 40px 100px rgba(0,0,0,0.7);transform:translateY(16px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .modal-ov.open .modal{transform:translateY(0) scale(1)}
  .modal-h{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--border)}
  .modal-h-title{font-size:17px;font-weight:700}
  .modal-h-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
  .modal-h-actions{display:flex;gap:8px;align-items:center}
  .btn-x{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:15px;transition:all .2s}
  .btn-x:hover{border-color:var(--crit);color:var(--crit)}
  .btn-exp{padding:8px 15px;border-radius:8px;border:1px solid var(--ok);background:rgba(46,204,113,.06);color:var(--ok);font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
  .btn-exp:hover{background:rgba(46,204,113,.16)}
  .modal-search{padding:14px 24px;border-bottom:1px solid var(--border)}
  .modal-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--sans);font-size:13px;padding:11px 14px;outline:none;transition:border-color .2s}
  .modal-search input:focus{border-color:var(--accent)}
  .modal-body{overflow:auto;flex:1}
  .modal-body::-webkit-scrollbar{width:7px;height:7px}
  .modal-body::-webkit-scrollbar-thumb{background:rgba(55,138,221,0.35);border-radius:4px}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--bg3);padding:11px 16px;text-align:left;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;z-index:2}
  td{padding:11px 16px;border-bottom:1px solid rgba(55,138,221,0.06);font-size:12.5px;white-space:nowrap}
  tr:hover td{background:rgba(55,138,221,0.04)}
  .cli-nome{font-weight:600}
  .sem-vinculo{font-family:var(--mono);font-size:10.5px;color:var(--dead);opacity:.85}
  .tag-cancelado{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(245,166,35,.14);color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
  .mono{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .st-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .st-pwrfail{background:rgba(155,89,182,0.15);color:#B98BD8}
  .st-los{background:rgba(230,126,34,0.15);color:#E9954A}
  .st-offline{background:rgba(255,91,82,0.15);color:var(--crit)}
  .st-outro{background:rgba(124,140,160,0.15);color:var(--dead)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="/static/logo.png" alt="CANAÃ" style="height:36px;width:auto;object-fit:contain">
    <div>
      <div class="logo-title">SAÚDE DA REDE</div>
      <div class="logo-sub">CONECTIVIDADE POR OLT</div>
    </div>
  </div>
  <nav>
    <a href="/painel" class="nav-btn">PAINEL</a>
    <a href="/historico" class="nav-btn">HISTÓRICO</a>
    <a href="/alertas" class="nav-btn">ALERTAS</a>
    <a href="/" class="nav-btn">SINAL</a>
    <a href="/saude" class="nav-btn active">SAÚDE</a>
    <a href="/consulta" class="nav-btn">CONSULTA</a>
    <a href="/os" class="nav-btn">OS</a>
    <a href="/kpis" class="nav-btn">KPIs</a>
    <a href="/mapa" class="nav-btn">MAPA</a>
  </nav>
  <div class="header-right">
    <span class="timestamp" id="timestamp">--</span>
  </div>
</header>

<main>
  <div id="conteudo">
    <div class="loading"><div class="spinner"></div>Carregando saúde da rede...</div>
  </div>
</main>

<!-- Modal lista offline -->
<div class="modal-ov" id="modalOv" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-h">
      <div>
        <div class="modal-h-title" id="modalTitle">Clientes offline</div>
        <div class="modal-h-sub" id="modalSub"></div>
      </div>
      <div class="modal-h-actions">
        <button class="btn-exp" id="modalExpBtn" onclick="exportarOffline()">↓ EXPORTAR EXCEL</button>
        <button class="btn-x" onclick="fecharModal()">✕</button>
      </div>
    </div>
    <div class="modal-tabs">
      <button class="mt-btn active" id="tabOffline" onclick="setModalTab('offline')">Clientes offline</button>
      <button class="mt-btn" id="tabPortas" onclick="setModalTab('portas')">Ocupação de portas</button>
    </div>
    <div class="modal-search" id="modalSearchBox">
      <input type="text" id="modalBusca" placeholder="Buscar cliente, serial, porta ou zona..." oninput="renderOfflineTable()">
    </div>
    <div class="modal-body">
      <table id="tblOffline">
        <thead><tr>
          <th>Cliente</th><th>Serial</th><th>Porta</th><th>Zona</th><th>Situação</th><th>Offline desde</th>
        </tr></thead>
        <tbody id="modalTbody"></tbody>
      </table>
      <table id="tblPortas" style="display:none">
        <thead><tr>
          <th>Porta PON</th><th>Ocupação</th><th>Ativos</th><th>Lixo</th><th>Livre agora</th><th>Livre se limpar</th>
        </tr></thead>
        <tbody id="portasTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const NIVEL_LBL = {ok:'Saudável', atencao:'Atenção', critico:'Crítico'};
const ST_MAP = {
  'Power fail': {cls:'st-pwrfail', lbl:'Sem energia', ic:'⚡'},
  'LOS':        {cls:'st-los',     lbl:'Sem sinal',   ic:'◈'},
  'Offline':    {cls:'st-offline', lbl:'Offline',     ic:'○'},
};
let _offlineCache = [], _offlineOlt = '';

function fmtTempo(iso){
  if(!iso) return '—';
  const d = new Date(iso.replace(' ','T'));
  if(isNaN(d)) return '—';
  const min = Math.floor((Date.now()-d)/60000);
  if(min < 60)  return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24)    return `há ${h}h`;
  const dias = Math.floor(h/24);
  return `há ${dias} dia${dias>1?'s':''}`;
}

// tempo em estado crítico (timestamp unix vindo do detector de alertas)
function fmtDesde(ts){
  if(!ts) return '';
  const seg = Date.now()/1000 - ts;
  const h = Math.floor(seg/3600);
  if(h < 1) return `${Math.floor(seg/60)} min`;
  if(h < 24) return `${h}h`;
  return `${Math.floor(h/24)}d ${h%24}h`;
}

// estado da visualização
let _dados = null;
let _view = 'cards';   // 'cards' | 'lista'
let _sort = 'pct';     // 'pct' | 'offline' | 'nome' | 'total'
const esc = s => String(s).replace(/'/g,"\\'");
const NIVEL_ORD = {critico:0, atencao:1, ok:2};

function ordenar(lista){
  const arr = [...lista];
  if(_sort==='pct')      arr.sort((a,b)=> b.pct_offline - a.pct_offline);
  else if(_sort==='offline') arr.sort((a,b)=> b.offline - a.offline);
  else if(_sort==='total')   arr.sort((a,b)=> b.total - a.total);
  else if(_sort==='nome')    arr.sort((a,b)=> a.olt.localeCompare(b.olt,'pt-BR'));
  return arr;
}

// Gauge circular SVG. pct = % offline. Anima o preenchimento após render.
function gauge(pct, nivel, size, stroke){
  const r = size/2 - stroke/2 - 2;
  const c = 2*Math.PI*r;
  const off = c * (1 - Math.min(pct,100)/100);
  const col = {ok:'var(--ok)',atencao:'var(--warn)',critico:'var(--crit)'}[nivel];
  const glow = {ok:'var(--ok-glow)',atencao:'var(--warn-glow)',critico:'var(--crit-glow)'}[nivel];
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="${stroke}"/>
    <circle class="g-fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${off}"
      style="transition:stroke-dashoffset 1.1s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 0 4px ${glow})"/>
  </svg>`;
}
function animarGauges(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('.g-fill').forEach(el=>{
      el.style.strokeDashoffset = el.getAttribute('data-target');
    });
  });
}

async function carregar(){
  try{
    const data = await (await fetch('/api/saude_olt')).json();
    if(data.status!=='ok') throw new Error(data.mensagem);
    document.getElementById('timestamp').textContent = 'Dados de ' + (data.timestamp||'--');
    render(data);
  }catch(e){
    document.getElementById('conteudo').innerHTML =
      `<div class="loading" style="color:var(--crit)">Erro ao carregar: ${e.message}</div>`;
  }
}

// ── Card de destaque (crítico / atenção) ──────────────────────
function renderAlertCard(o, i){
  const bk = [];
  if(o.power_fail)   bk.push(`<div class="bk energia"><span class="bk-ic">⚡</span><b>${o.power_fail}</b><span>sem energia</span></div>`);
  if(o.offline_puro) bk.push(`<div class="bk offline"><span class="bk-ic">○</span><b>${o.offline_puro}</b><span>offline</span></div>`);
  if(o.los)          bk.push(`<div class="bk sinal"><span class="bk-ic">◈</span><b>${o.los}</b><span>sem sinal</span></div>`);
  const selo = (o.nivel==='critico' && o.critico_desde)
    ? `<div class="acard-alerta"><span class="ping"></span> Crítica há ${fmtDesde(o.critico_desde)} · alerta enviado</div>`
    : '';
  return `
    <div class="acard ${o.nivel}" style="animation-delay:${i*0.05}s">
      <div class="acard-head">
        <div>
          <div class="acard-olt">${o.olt}</div>
          <div class="acard-zone">${o.total.toLocaleString('pt-BR')} clientes ativos</div>
          ${selo}
        </div>
        <span class="badge ${o.nivel}">${NIVEL_LBL[o.nivel]}</span>
      </div>
      <div class="acard-body">
        <div class="gauge-wrap">
          ${gauge(o.pct_offline, o.nivel, 78, 8)}
          <div class="g-val ${o.nivel}"><b>${o.pct_offline}%</b><span>offline</span></div>
        </div>
        <div class="acard-info">
          <div class="acard-clientes">
            <span class="big">${o.offline.toLocaleString('pt-BR')}</span>
            <span class="mut">clientes ativos fora do ar</span>
          </div>
          <div class="breakdown">${bk.join('')}</div>
          ${o.lixo ? `<div class="acard-lixo" title="ONUs de clientes cancelados ou sem vínculo, excluídas do cálculo">+${o.lixo.toLocaleString('pt-BR')} canceladas/órfãs (não contam)</div>` : ''}
        </div>
      </div>
      <button class="acard-btn" onclick="verOffline('${esc(o.olt)}')">VER CLIENTES OFFLINE →</button>
    </div>`;
}

// ── Card compacto saudável (barra linear) ─────────────────────
function renderOkCard(o, i){
  return `
    <div class="okcard" style="animation-delay:${i*0.03}s" onclick="verOffline('${esc(o.olt)}')">
      <div class="okcard-top">
        <span class="okcard-olt">${o.olt}</span>
        <span class="okcard-pct">${o.pct_offline}%</span>
      </div>
      <div class="okcard-bar"><div class="okcard-bar-fill" style="width:${Math.min(o.pct_offline,100)}%"></div></div>
      <div class="okcard-sub"><b>${o.offline.toLocaleString('pt-BR')}</b> de <b>${o.total.toLocaleString('pt-BR')}</b> offline</div>
    </div>`;
}

// ── Linha do modo Lista (tabela) ──────────────────────────────
function renderListRow(o){
  return `
    <tr class="lv-row" onclick="verOffline('${esc(o.olt)}')">
      <td><span class="lv-status"><span class="lv-dot ${o.nivel}"></span>${o.olt}</span></td>
      <td><span class="lv-pct ${o.nivel}">${o.pct_offline}%</span></td>
      <td><span class="lv-bar"><span class="lv-bar-fill ${o.nivel}" style="width:${Math.min(o.pct_offline,100)}%"></span></span></td>
      <td><span class="lv-abs">${o.offline.toLocaleString('pt-BR')}</span> <span class="lv-mini">/ ${o.total.toLocaleString('pt-BR')}</span></td>
      <td><span class="lv-mini">⚡ ${o.power_fail||0}&nbsp;&nbsp;○ ${o.offline_puro||0}&nbsp;&nbsp;◈ ${o.los||0}</span></td>
    </tr>`;
}

function render(data){
  _dados = data;
  const r = data.resumo, lim = data.limiares, olts = data.olts;

  let totOn=0, tot=0;
  olts.forEach(o=>{ totOn+=o.online; tot+=o.total; });
  const pctOn = tot ? (totOn/tot*100) : 0;
  const pctOff = 100 - pctOn;
  const nivelRede = r.critico>0 ? 'critico' : r.atencao>0 ? 'atencao' : 'ok';

  let frase, sub;
  if(r.critico > 0){
    frase = `${r.critico} OLT${r.critico>1?'s precisam':' precisa'} de atenção imediata`;
    sub = `Acima de ${lim.critico}% dos clientes offline. Recomenda-se acionar campo/NOC para verificação.`;
  } else if(r.atencao > 0){
    frase = `${r.atencao} OLT${r.atencao>1?'s':''} em observação`;
    sub = `Entre ${lim.atencao}% e ${lim.critico}% de clientes offline. Vale acompanhar de perto.`;
  } else {
    frase = 'Rede operando com estabilidade';
    sub = `Nenhuma OLT acima de ${lim.atencao}% de clientes offline.`;
  }

  const hero = `
    <div class="hero">
      <div class="hero-gauge">
        ${gauge(pctOff, nivelRede, 92, 8)}
        <div class="val"><b>${pctOn.toFixed(1)}%</b><span>Disponível</span></div>
      </div>
      <div class="hero-txt">
        <div class="hero-eyebrow"><span class="hero-dot"></span> Central de Saúde · ${tot.toLocaleString('pt-BR')} clientes monitorados</div>
        <h1>${frase}</h1>
        <p>${sub}</p>
      </div>
      <div class="hero-chips">
        <div class="chip critico"><b>${r.critico}</b><span>Críticas</span></div>
        <div class="chip atencao"><b>${r.atencao}</b><span>Atenção</span></div>
        <div class="chip ok"><b>${r.ok}</b><span>Saudáveis</span></div>
      </div>
    </div>`;

  const toolbar = `
    <div class="toolbar">
      <div class="view-toggle">
        <button class="vt-btn ${_view==='cards'?'active':''}" onclick="setView('cards')">▦ Cards</button>
        <button class="vt-btn ${_view==='lista'?'active':''}" onclick="setView('lista')">☰ Lista</button>
      </div>
      <div class="tb-right">
        <div class="sort-box">
          <label>Ordenar por</label>
          <select class="sort-sel" onchange="setSort(this.value)">
            <option value="pct"     ${_sort==='pct'?'selected':''}>Maior % offline</option>
            <option value="offline" ${_sort==='offline'?'selected':''}>Mais clientes fora</option>
            <option value="total"   ${_sort==='total'?'selected':''}>Maior OLT</option>
            <option value="nome"    ${_sort==='nome'?'selected':''}>Nome (A-Z)</option>
          </select>
        </div>
        <button class="btn-limpeza" onclick="exportarLimpeza(this)" title="Exporta todas as ONUs canceladas/órfãs para a equipe de cadastro limpar no SmartOLT">🧹 Exportar limpeza</button>
      </div>
    </div>`;

  document.getElementById('conteudo').innerHTML = hero + toolbar + '<div id="miolo"></div>';
  renderMiolo();
}

function renderMiolo(){
  const olts = ordenar(_dados.olts);
  let html = '';

  if(_view === 'lista'){
    html = `<div class="list-view"><table class="lv-table">
      <thead><tr><th>OLT</th><th>% Offline</th><th></th><th>Clientes fora</th><th>Causas</th></tr></thead>
      <tbody>${olts.map(renderListRow).join('')}</tbody>
    </table></div>`;
  } else {
    const alerta   = olts.filter(o=>o.nivel!=='ok');
    const saudavel = olts.filter(o=>o.nivel==='ok');
    if(alerta.length){
      html += `<div class="sec">
        <div class="sec-label"><span class="tag alerta">Requer atenção</span> ${alerta.length} OLT${alerta.length>1?'s':''}</div>
        <div class="grid-alerta">${alerta.map(renderAlertCard).join('')}</div>
      </div>`;
    }
    if(saudavel.length){
      html += `<div class="sec">
        <div class="sec-label"><span class="tag saudavel">Operando normalmente</span> ${saudavel.length} OLT${saudavel.length>1?'s':''}</div>
        <div class="grid-ok">${saudavel.map(renderOkCard).join('')}</div>
      </div>`;
    }
  }
  document.getElementById('miolo').innerHTML = html;
  animarGauges();  // anima o hero (sempre) + gauges dos cards (se houver)
}

function setView(v){ _view = v; render(_dados); }
function setSort(s){ _sort = s; renderMiolo(); }

let _portasCache = [], _portasLimite = 128;

async function verOffline(olt){
  _offlineOlt = olt;
  _portasCache = [];
  document.getElementById('modalTitle').textContent = olt;
  document.getElementById('modalSub').textContent = 'Carregando...';
  document.getElementById('modalBusca').value = '';
  document.getElementById('modalTbody').innerHTML = '';
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow = 'hidden';
  setModalTab('offline');
  try{
    const data = await (await fetch('/api/saude_olt/offline?olt='+encodeURIComponent(olt))).json();
    if(data.status!=='ok') throw new Error(data.mensagem);
    _offlineCache = data.onus;
    const partes = [];
    if(data.ativos)     partes.push(`<b style="color:var(--text)">${data.ativos.toLocaleString('pt-BR')}</b> clientes ativos`);
    if(data.cancelados) partes.push(`${data.cancelados.toLocaleString('pt-BR')} cancelados`);
    if(data.sem_vinculo)partes.push(`${data.sem_vinculo.toLocaleString('pt-BR')} sem vínculo`);
    document.getElementById('modalSub').innerHTML = partes.join(' · ') || `${(data.total||0)} fora do ar`;
    renderOfflineTable();
  }catch(e){
    document.getElementById('modalSub').textContent = 'Erro: ' + e.message;
  }
}

function setModalTab(tab){
  const off = tab==='offline';
  document.getElementById('tabOffline').classList.toggle('active', off);
  document.getElementById('tabPortas').classList.toggle('active', !off);
  document.getElementById('tblOffline').style.display = off ? '' : 'none';
  document.getElementById('tblPortas').style.display = off ? 'none' : '';
  document.getElementById('modalSearchBox').style.display = off ? '' : 'none';
  document.getElementById('modalExpBtn').textContent = off ? '↓ EXPORTAR EXCEL' : '↓ EXPORTAR PORTAS';
  document.getElementById('modalExpBtn').onclick = off ? exportarOffline : exportarPortas;
  if(!off && !_portasCache.length) carregarPortas();
}

async function carregarPortas(){
  document.getElementById('portasTbody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted)">Carregando portas...</td></tr>`;
  try{
    const data = await (await fetch('/api/saude_olt/portas?olt='+encodeURIComponent(_offlineOlt))).json();
    if(data.status!=='ok') throw new Error(data.mensagem);
    _portasCache = data.portas;
    _portasLimite = data.limite;
    renderPortas();
  }catch(e){
    document.getElementById('portasTbody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--crit)">Erro: ${e.message}</td></tr>`;
  }
}

function renderPortas(){
  const tb = document.getElementById('portasTbody');
  if(!_portasCache.length){ tb.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted)">Sem dados.</td></tr>`; return; }
  tb.innerHTML = _portasCache.map(p=>{
    const pctA = p.total ? p.ativos/_portasLimite*100 : 0;
    const pctL = p.total ? p.lixo/_portasLimite*100 : 0;
    const cheia = p.ocupacao >= 80 ? 'porta-cheia' : '';
    return `<tr>
      <td><span class="mono">${p.porta}</span></td>
      <td>
        <div class="porta-bar" title="${p.ativos} ativos + ${p.lixo} lixo de ${_portasLimite}">
          <div class="porta-seg-ativo" style="width:${pctA}%"></div>
          <div class="porta-seg-lixo" style="width:${pctL}%"></div>
        </div>
        <span class="porta-livre ${cheia}"> ${p.ocupacao}%</span>
      </td>
      <td><span class="mono" style="color:var(--ok)">${p.ativos}</span></td>
      <td><span class="mono" style="color:var(--dead)">${p.lixo||'—'}</span></td>
      <td><span class="porta-livre">${p.livre}</span></td>
      <td><span class="porta-livre" style="color:var(--ok)">${p.livre_limpo}</span></td>
    </tr>`;
  }).join('');
}

function exportarPortas(){
  if(!_portasCache.length) return;
  const linhas = _portasCache.map(p=>({
    'Porta PON': p.porta, 'Ocupação %': p.ocupacao, 'Ativos': p.ativos,
    'Lixo (cancel/órfã)': p.lixo, 'Livre agora': p.livre, 'Livre se limpar': p.livre_limpo,
    'Limite split': _portasLimite,
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);
  ws['!cols'] = [{wch:12},{wch:11},{wch:9},{wch:18},{wch:12},{wch:15},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Portas');
  XLSX.writeFile(wb, `Ocupacao_Portas_${_offlineOlt.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toISOString().split('T')[0]}.xlsx`);
}

async function exportarLimpeza(btn){
  const txt = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Gerando...';
  try{
    const data = await (await fetch('/api/saude_olt/limpeza')).json();
    if(data.status!=='ok') throw new Error(data.mensagem);
    const linhas = data.onus.map(o=>({
      'OLT': o.olt, 'Porta': o.porta, 'Serial': o.sn,
      'Ex-cliente': o.ex_cliente || '', 'ID Cliente': o.cliente_id || '',
      'Tipo': o.tipo, 'Status ONU': o.status_onu,
    }));
    const ws = XLSX.utils.json_to_sheet(linhas);
    ws['!cols'] = [{wch:16},{wch:12},{wch:16},{wch:34},{wch:10},{wch:13},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Limpeza SmartOLT');
    XLSX.writeFile(wb, `Limpeza_ONUs_${new Date().toISOString().split('T')[0]}.xlsx`);
  }catch(e){ alert('Erro ao gerar: '+e.message); }
  finally{ btn.disabled = false; btn.textContent = txt; }
}

function renderOfflineTable(){
  const busca = document.getElementById('modalBusca').value.toLowerCase().trim();
  const lista = busca
    ? _offlineCache.filter(o => [o.cliente_nome,o.sn,o.porta,o.zona,o.cliente_id].map(v=>String(v||'').toLowerCase()).join(' ').includes(busca))
    : _offlineCache;
  const tbody = document.getElementById('modalTbody');
  if(!lista.length){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:44px;color:var(--muted)">Nenhum cliente encontrado.</td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(o=>{
    const st = ST_MAP[o.status] || {cls:'st-outro', lbl:o.status||'—', ic:'•'};
    let nome;
    if(o.cliente_nome){
      const cancelado = o.identificado && o.cliente_ativo===false
        ? ' <span class="tag-cancelado" title="Cliente inativo no IXC">cancelado</span>' : '';
      nome = `<span class="cli-nome">${o.cliente_nome}</span>${o.cliente_id?` <span class="mono">#${o.cliente_id}</span>`:''}${cancelado}`;
    } else {
      nome = '<span class="sem-vinculo" title="Serial sem vínculo de cliente no IXC — provável troca de equipamento não cadastrada">⚠ sem vínculo</span>';
    }
    return `<tr>
      <td>${nome}</td>
      <td><span class="mono">${o.sn||'—'}</span></td>
      <td><span class="mono">${o.porta||'—'}</span></td>
      <td>${o.zona||'—'}</td>
      <td><span class="st-badge ${st.cls}">${st.ic} ${st.lbl}</span></td>
      <td><span class="mono">${fmtTempo(o.ultima_mudanca)}</span></td>
    </tr>`;
  }).join('');
}

function exportarOffline(){
  if(!_offlineCache.length) return;
  const linhas = _offlineCache.map(o=>({
    'Cliente': o.cliente_nome || 'não identificado',
    'ID Cliente': o.cliente_id || '',
    'Serial': o.sn || '',
    'Porta': o.porta || '',
    'Zona': o.zona || '',
    'Situação': (ST_MAP[o.status]||{lbl:o.status}).lbl,
    'Offline desde': o.ultima_mudanca || '',
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);
  ws['!cols'] = [{wch:32},{wch:10},{wch:18},{wch:12},{wch:16},{wch:14},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Offline');
  const nome = _offlineOlt.replace(/[^a-zA-Z0-9]/g,'_');
  XLSX.writeFile(wb, `Offline_${nome}_${new Date().toISOString().split('T')[0]}.xlsx`);
}

function fecharModal(){
  document.getElementById('modalOv').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharModal(); });

carregar();
</script>
</body>
</html>
